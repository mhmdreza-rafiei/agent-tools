name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - run: node scripts/lint-artifacts/run.mjs
      - run: node scripts/check-compat/run.mjs
      - run: node scripts/validate-profiles/run.mjs
      - run: node scripts/audit-catalog/run.mjs
      - run: node docs/sandbox/demo/check.js
